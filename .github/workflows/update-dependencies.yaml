name: Update Clash-Core and Go Modules
on:
  push:
    tags:
      - 'trigger-*'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 每天自动检查更新

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Token
        uses: tibdex/github-app-token@v2
        id: generate-token
        with:
          app_id: ${{ secrets.MAINTAINER_APPID }}
          private_key: ${{ secrets.MAINTAINER_APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: dev-core
          submodules: recursive
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Update submodules
        run: |
          git submodule update --init --recursive --remote --force
          cd core/Clash.Meta
          echo "CORE_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Install update-go-mod-replace
        run: go install github.com/metacubex/update-go-mod-replace@latest

      - name: Update Core Gomod
        run: |
          cd core
          update-go-mod-replace ./Clash.Meta/go.mod ./go.mod
          go mod tidy

      - name: Sync and Push or Prepare PR
        id: sync
        run: |
          git config --local user.email "kafeixiang@example.com"
          git config --local user.name "kafeixiang"
          
          git add .
          if git diff --staged --quiet; then
            echo "No changes detected."
            echo "synced=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 1. 强制压缩逻辑：如果上一个是自动更新，就吃掉它，保持提交记录只有一个 chore
          LAST_MSG=$(git log -1 --pretty=%B)
          SQUASHED=false
          if [[ "$LAST_MSG" == "chore: update core to"* ]]; then
            echo "Detected previous core update commit. Squashing..."
            git reset --soft HEAD~1
            SQUASHED=true
            git add .
          fi
          
          git commit -m "chore: update core to ${{ env.CORE_SHA }} and sync dependencies"
          
          TARGET_BRANCH="dev-core"
          PUSH_SUCCESS=false
          
          # 2. 尝试推送（如果压缩了则强制推送，没压缩则普通推送）
          if [ "$SQUASHED" = "true" ]; then
            if git push --force-with-lease origin HEAD:$TARGET_BRANCH; then
              PUSH_SUCCESS=true
            fi
          else
            if git push origin HEAD:$TARGET_BRANCH; then
              PUSH_SUCCESS=true
            fi
          fi
          
          # 3. 强制变基逻辑：如果上面失败了（有竞争），尝试 rebase 到最新
          if [ "$PUSH_SUCCESS" = "false" ]; then
            echo "Direct push failed, trying rebase sync..."
            if git pull --rebase origin $TARGET_BRANCH; then
              if git push origin HEAD:$TARGET_BRANCH; then
                PUSH_SUCCESS=true
              fi
            else
              git rebase --abort
            fi
          fi
          
          echo "synced=$PUSH_SUCCESS" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.sync.outputs.synced != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}
          base: dev-core
          branch: update-dependencies
          delete-branch: true
          title: 'Update Core to ${{ env.CORE_SHA }}'
          body: 'Automated core update failed to push directly, created PR instead.'

      - name: Cleanup trigger tag
        if: always() && startsWith(github.ref, 'refs/tags/trigger-')
        run: |
          echo "Cleaning up trigger tag: ${{ github.ref_name }}"
          git push origin --delete ${{ github.ref_name }}